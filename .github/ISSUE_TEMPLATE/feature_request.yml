name: 💡 功能建议
description: 想要的新功能或改进，每条都会登记到 README「社区建议」
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的建议
      description: 想要什么功能 / 哪里用着不顺手
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 使用场景
      description: 什么情况下会用到，现在是怎么凑合的
  - type: input
    id: source
    attributes:
      label: 来源（可选）
      description: 如果是在 LINUX DO 等社区提过的，可以贴个链接
