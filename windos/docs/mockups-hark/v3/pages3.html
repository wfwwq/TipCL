<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipCL 自定义布局 v3 · 其他页面</title>
</head>
<body data-accent="green">
<header class="doc">
  <h1>同一套编辑规则放到其他页面：启动、实例库、联机、游戏时长、Java</h1>
  <p>用下面的按钮切换页面，也可以直接点窗口里的页签、设置左侧导航和启动页的「联机」按钮。每页都能在「常态 / 编辑态」之间切换，右键页面空白处也能进入编辑。区块名和页面结构来自 <code>windos/src/TipCL/Pages</code> 里各页的区块定义。</p>
  <div class="ctl">
    <div class="seg" id="segPage">
      <button data-p="launch" class="on">启动</button><button data-p="library">实例库</button><button data-p="multi">联机</button><button data-p="playtime">游戏时长</button><button data-p="java">Java</button>
    </div>
    <div class="seg" id="segEdit"><button data-e="0" class="on">常态</button><button data-e="1">编辑态</button></div>
    <div class="seg" id="segAccent"><button data-a="green" class="on">绿色</button><button data-a="red">红色</button></div>
  </div>
</header>
<style>
:root{
  --page-ink:#1f1f1f;--page-ink2:#5c5c5c;--page-ink3:#8c8c8c;
  --page-paper:#fff;--page-paper2:#f2f2f2;--page-paper3:#e7e7e7;
  --page-line:rgba(0,0,0,.08);--page-line2:rgba(0,0,0,.16);
  --page-stage:#2b3040;--page-ok:#22a35a;
  --page-font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --page-mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
  --page-hero:url(hero.jpg),url(/c/3a2a5c8a-c7cb-4079-b786-e4c80e009d24/workspace/artifacts/tipcl_v3/hero.jpg);
}
body[data-accent=green]{--page-accent:#2a7d52;--page-accent-soft:#e5f2eb;--page-accent-line:rgba(42,125,82,.3);--page-accent-glow:rgba(42,125,82,.35)}
body[data-accent=red]{--page-accent:#c9403f;--page-accent-soft:#fbeaea;--page-accent-line:rgba(201,64,63,.3);--page-accent-glow:rgba(201,64,63,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-stage);color:#e9eaee;font-family:var(--page-font);font-size:13px;line-height:1.5;padding:28px 20px 48px}
button{font-family:inherit;font-size:13px;color:inherit}
code{font-family:var(--page-mono);font-size:12px;background:rgba(255,255,255,.08);padding:0 4px;border-radius:4px;color:#fff}
.doc{max-width:900px;margin:0 auto 16px}
.doc h1{font-size:21px;font-weight:800;color:#fff;line-height:1.35}
.doc p{color:rgba(255,255,255,.64);margin-top:6px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.08)}
.seg button{background:none;border:0;padding:4px 12px;border-radius:8px;color:rgba(255,255,255,.72);cursor:pointer}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:var(--page-ink);font-weight:700}
.stage{overflow-x:auto;padding-bottom:6px}

.win{position:relative;width:900px;height:600px;margin:0 auto;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#ececec 0%,#f7f7f7 60%,#f2f2f2 100%);color:var(--page-ink);box-shadow:0 18px 50px rgba(0,0,0,.4);user-select:none}
.tb{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;background:rgba(255,255,255,.94);border-bottom:1px solid var(--page-line);z-index:20}
.win.dark .tb{background:rgba(255,255,255,.12);backdrop-filter:blur(18px);border-bottom-color:rgba(255,255,255,.16);color:#fff}
.logo{display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;font-weight:700;font-size:15px}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--page-accent);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center;font-weight:800}
.tabs{display:flex;height:100%}
.tab{padding:0 12px;display:flex;align-items:center;font-size:13px;color:var(--page-ink2);position:relative;cursor:pointer;border:0;background:none}
.win.dark .tab{color:rgba(255,255,255,.72)}
.tab:hover{color:var(--page-ink)}.win.dark .tab:hover{color:#fff}
.tab.on{color:var(--page-ink);font-weight:700}.win.dark .tab.on{color:#fff}
.tab.on:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--page-accent)}
.win.dark .tab.on:after{background:#fff}
.sp{flex:1}
.aip{height:28px;display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:999px;border:1px solid var(--page-line2);font-size:12px;font-weight:700;margin-right:6px}
.win.dark .aip{border-color:rgba(255,255,255,.3)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.av{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;font-size:13px;font-weight:700}
.av b{width:26px;height:26px;border-radius:50%;background:var(--page-accent);color:#fff;display:grid;place-items:center;font-size:12px}
.vsep{width:1px;height:16px;background:var(--page-line2);margin:0 6px}
.win.dark .vsep{background:rgba(255,255,255,.25)}
.cap{width:46px;height:46px;display:grid;place-items:center}
.cap svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.1;fill:none;stroke-linecap:round}
svg.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.body{position:absolute;left:0;right:0;top:46px;bottom:0}

/* 控件 */
.b{height:30px;border-radius:8px;padding:0 12px;border:1px solid var(--page-line);background:var(--page-paper2);color:var(--page-ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.b:hover{background:var(--page-paper3)}
.b:disabled{opacity:.4;cursor:default}
.b.soft{background:var(--page-accent-soft);border-color:var(--page-accent-line);color:var(--page-accent);font-weight:700}
.b.soft:hover{background:var(--page-accent);color:#fff}
.b.pri{background:var(--page-accent);border-color:var(--page-accent);color:#fff;font-weight:700}
.b.ic{width:30px;padding:0;justify-content:center}
.b.ghost{background:none;border-color:transparent;color:var(--page-ink2)}
.b.ghost:hover{background:var(--page-paper2)}
.b .cnt{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--page-accent);color:#fff;font-size:12px;line-height:16px;text-align:center;font-weight:700}
.b.soft:hover .cnt{background:#fff;color:var(--page-accent)}
.sg2{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:var(--page-paper3)}
.sg2 button{border:0;background:none;height:24px;padding:0 10px;border-radius:6px;color:var(--page-ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sg2 button.on{background:#fff;color:var(--page-ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:36px;height:20px;border-radius:10px;background:#cfcfcf;position:relative;flex:none;display:inline-block}
.sw:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--page-accent)}.sw.on:after{left:18px}
.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,8px);padding:8px 14px;border-radius:12px;background:rgba(28,30,36,.94);color:#fff;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu{position:absolute;min-width:168px;padding:6px;border-radius:12px;background:#fff;color:var(--page-ink);box-shadow:0 12px 32px rgba(0,0,0,.2),0 0 0 1px var(--page-line);display:none;z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--page-paper2)}
.menu hr{border:0;border-top:1px solid var(--page-line);margin:4px 6px}

/* 编辑条 */
.ebar{position:absolute;left:22px;right:22px;top:12px;z-index:25;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s ease-out}
.win.edit .ebar{opacity:1;transform:none;pointer-events:auto}
.ebox{height:46px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-radius:12px;background:#fff;color:var(--page-ink);box-shadow:0 2px 10px rgba(0,0,0,.1),0 0 0 1px var(--page-line)}
.ebox h3{font-size:13px;font-weight:800;white-space:nowrap}
.ebox .hint{font-size:12px;color:var(--page-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ebox .vs{width:1px;height:18px;background:var(--page-line2);margin:0 2px}

/* 区块 */
.cv{overflow-y:auto;overflow-x:hidden;position:relative;margin:0 -10px;padding:0 10px}
.win.edit .cv{padding-top:18px}
.cv::-webkit-scrollbar{width:8px}.cv::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:8px}
.dark .cv::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
.inner{position:relative;margin-bottom:16px;transition:height .22s ease-out}
.blk{position:absolute;border-radius:12px;transition:left .22s ease-out,top .22s ease-out,width .22s ease-out,height .22s ease-out,box-shadow .15s}
.blk .bc{height:100%;overflow:hidden;border-radius:12px}
.win.edit .blk{outline:1.5px dashed var(--page-line2);outline-offset:4px;cursor:grab}
.win.edit.dark .blk{outline-color:rgba(255,255,255,.35)}
.win.edit .blk:hover{outline-color:rgba(0,0,0,.34)}
.win.edit.dark .blk:hover{outline-color:rgba(255,255,255,.7)}
.win.edit .blk .bc{pointer-events:none}
.win.edit .blk.sel{outline:2px solid var(--page-accent)}
.win.edit.dark .blk.sel{outline-color:#fff}
.blk.drag{transition:box-shadow .15s;z-index:20;cursor:grabbing;box-shadow:0 16px 36px rgba(0,0,0,.22);outline:2px solid var(--page-accent)!important}
.blk.flash{animation:fl .9s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--page-accent-glow)}100%{box-shadow:0 0 0 0 transparent}}
.lab{position:absolute;left:8px;top:-14px;height:24px;display:none;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:8px;background:#fff;color:var(--page-ink);box-shadow:0 2px 8px rgba(0,0,0,.14),0 0 0 1px var(--page-line);font-size:12px;font-weight:700;z-index:3;white-space:nowrap}
.lab em{font-style:normal;font-weight:400;color:var(--page-ink3)}
.lab .gr{color:var(--page-ink3)}
.acts{position:absolute;right:8px;top:-14px;display:none;gap:4px;z-index:3}
.acts button{width:26px;height:24px;border-radius:8px;border:0;background:#fff;color:var(--page-ink2);box-shadow:0 2px 8px rgba(0,0,0,.14),0 0 0 1px var(--page-line);display:grid;place-items:center;cursor:pointer}
.acts button:hover{color:var(--page-ink)}
.acts button.del:hover{background:#c42b1c;color:#fff}
.win.edit .blk:hover .lab,.win.edit .blk.sel .lab,.win.edit .blk.drag .lab,.win.edit .blk:hover .acts,.win.edit .blk.sel .acts{display:flex}
.rz{position:absolute;right:-9px;top:50%;width:10px;height:36px;margin-top:-18px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22),0 0 0 1px var(--page-line2);cursor:ew-resize;display:none;z-index:4}
.rz:after{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--page-ink3)}
.win.edit.grid .blk:hover .rz,.win.edit.grid .blk.sel .rz,.win.edit.grid .blk.rs .rz{display:block}
.rz b{position:absolute;left:16px;top:6px;padding:2px 8px;border-radius:8px;background:var(--page-ink);color:#fff;font-size:12px;white-space:nowrap;display:none}
.blk.rs .rz b{display:block}
.ph{position:absolute;display:none;border-radius:12px;background:var(--page-accent-soft);border:1.5px dashed var(--page-accent);transition:left .15s ease-out,top .15s ease-out,width .15s ease-out,height .15s ease-out}
.dark .ph{background:rgba(255,255,255,.12);border-color:#fff}
.colsbg{position:absolute;inset:0;display:none;grid-template-columns:repeat(6,1fr);gap:12px;pointer-events:none}
.win.edit.grid.busy .colsbg{display:grid}
.colsbg i{border-radius:8px;background:rgba(0,0,0,.035)}
.dark .colsbg i{background:rgba(255,255,255,.06)}

/* 卡片内容(浅色) */
.wcard{background:#fff;border-radius:12px;height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.04);min-width:0;overflow:hidden}
.wl{font-size:12px;color:var(--page-ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.wt{font-size:13px;line-height:1.55}
.wb{font-size:21px;font-weight:800;line-height:1.3}
.wb small{font-size:13px;font-weight:400;color:var(--page-ink2)}
.wb.xl{font-size:34px;line-height:1.2}
.mono{font-family:var(--page-mono);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--page-ok);display:inline-block;flex:none}
.hrow{display:flex;align-items:center;gap:12px;min-width:0}
.hrow .grow{flex:1;min-width:0}
.bars{display:flex;gap:6px;align-items:flex-end;margin-top:auto;height:44px}
.bars i{flex:1;border-radius:4px;background:var(--page-paper3)}
.bars i.now{background:var(--page-accent)}
.lst{display:flex;flex-direction:column;margin-top:2px}
.lst>div{display:flex;align-items:center;gap:12px;height:40px;border-top:1px solid var(--page-line)}
.lst>div:first-child{border-top:0}
.lst .nm{font-weight:700;width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .meta{color:var(--page-ink2);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .bar{flex:1;height:6px;border-radius:3px;background:var(--page-paper2);overflow:hidden}
.lst .bar i{display:block;height:100%;background:var(--page-accent);border-radius:3px}
.tg{font-size:12px;padding:0 8px;border-radius:6px;background:var(--page-paper2);color:var(--page-ink2);white-space:nowrap}
.tg.ac{background:var(--page-accent-soft);color:var(--page-accent);font-weight:700}
.av2{width:28px;height:28px;border-radius:8px;background:var(--page-paper3);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.radio{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.radio span{display:flex;align-items:center;gap:8px}
.radio span:before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--page-line2);flex:none}
.radio span.on:before{border:4px solid var(--page-accent)}
.dd{height:30px;border-radius:8px;border:1px solid var(--page-line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;min-width:120px}
.dv{height:100%;display:flex;align-items:center;gap:10px;color:var(--page-ink3);font-size:12px}
.dv:before,.dv:after{content:"";flex:1;height:1px;background:var(--page-line2)}
/* 深色玻璃(启动页) */
.dark .wcard{background:rgba(14,18,27,.5);backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(255,255,255,.14);color:#fff;box-shadow:none}
.dark .wl{color:rgba(255,255,255,.66)}
.dark .wb small{color:rgba(255,255,255,.7)}
.dark .bars i{background:rgba(255,255,255,.3)}
.dark .lst>div{border-top-color:rgba(255,255,255,.1)}
.dark .lst .meta{color:rgba(255,255,255,.62)}
.dark .lst .bar{background:rgba(255,255,255,.14)}
.dark .dv{color:rgba(255,255,255,.6)}.dark .dv:before,.dark .dv:after{background:rgba(255,255,255,.25)}

/* 启动页 */
.lp .bg{position:absolute;inset:-46px 0 0;background-image:var(--page-hero);background-size:cover;background-position:center}
.lp .shade{position:absolute;inset:-46px 0 0;background:linear-gradient(90deg,rgba(10,14,22,.8) 0%,rgba(10,14,22,.45) 45%,rgba(10,14,22,.15) 80%),linear-gradient(0deg,rgba(10,14,22,.75),rgba(10,14,22,0) 55%)}
.hero{position:absolute;left:56px;right:56px;top:0;height:300px;display:flex;flex-direction:column;justify-content:center;color:#fff;transition:opacity .25s,filter .25s,padding .25s}
.win.edit .hero{opacity:.45;filter:saturate(.4);pointer-events:none;padding-top:44px}
.lock{position:absolute;right:56px;top:72px;display:none;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;z-index:2}
.win.edit .lock{display:inline-flex}
.k{font-size:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:8px}
.k .dot{background:#4ade80;box-shadow:0 0 8px #4ade80}
.t{font-size:34px;font-weight:800;margin:4px 0 2px;display:flex;align-items:center;gap:10px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.chips{display:flex;gap:6px;margin:10px 0 22px}
.chip{font-size:12px;padding:2px 10px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.row{display:flex;gap:10px;align-items:center}
.go{height:48px;border-radius:12px;padding:0 28px;background:var(--page-accent);color:#fff;border:0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;box-shadow:0 6px 20px var(--page-accent-glow);cursor:pointer}
.gl{height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer}
.gl:hover{background:rgba(255,255,255,.24)}
.gl.sq{width:48px;padding:0;justify-content:center}
.zoneL{position:absolute;left:56px;right:56px;top:300px;bottom:12px;display:flex;flex-direction:column;border-radius:12px;transition:background .2s}
.zoneL .cv{flex:1;min-height:0}
.zl-lab{display:none;font-size:12px;color:rgba(255,255,255,.75);margin:0 0 -6px 2px}
.win.edit .zl-lab{display:block}
.news{height:100%;display:flex;align-items:center;gap:12px;padding:0 16px}
.news .nb{font-size:12px;background:var(--page-accent);padding:1px 8px;border-radius:8px;flex:none}
.news .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news .nm{font-size:12px;color:rgba(255,255,255,.66);flex:none}
.log{flex:1;font-family:var(--page-mono);font-size:12px;line-height:1.6;color:rgba(255,255,255,.75);overflow:hidden;white-space:nowrap}
.log b{color:#fbbf24;font-weight:400}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--page-accent)}

/* 浅色页面 */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 22px 0;transition:padding .22s ease-out}
.win.edit .pg{padding-top:66px}
.pg .cv{flex:1;min-height:0}
.phd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phd h2{font-size:21px;font-weight:800}
.phd .muted{color:var(--page-ink3)}
.back{width:30px;height:30px;border-radius:8px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--page-ink2)}
.back:hover{background:var(--page-paper3)}
.sgl{position:absolute;inset:0;display:grid;grid-template-columns:168px 1fr}
.sgl .pg{position:relative;padding-left:8px}
.nav{padding:16px 10px 16px 14px;display:flex;flex-direction:column;gap:2px}
.nav button{height:34px;display:flex;align-items:center;padding:0 12px;border-radius:8px;color:var(--page-ink2);border:0;background:none;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.6)}
.nav button.on{background:#fff;color:var(--page-ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.lead{color:var(--page-ink2);margin:-8px 0 12px}

/* 实例库 */
.lib{position:absolute;inset:0;display:flex;padding:16px 22px 16px}
.lf{flex:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.lv{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.dvd{flex:none;width:18px;position:relative;cursor:col-resize}
.dvd:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-radius:2px;background:transparent;transition:background .15s}
.dvd:hover:before,.dvd.on:before{background:var(--page-accent)}
.dvd b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:24px;padding:0 8px;border-radius:8px;background:var(--page-ink);color:#fff;font-size:12px;display:none;place-items:center;white-space:nowrap;z-index:3}
.dvd.on b{display:grid}
.win.edit .dvd:before{background:var(--page-accent-line)}
.dvhint{position:absolute;left:14px;bottom:4px;display:none;white-space:nowrap;font-size:12px;background:#fff;color:var(--page-ink);padding:4px 10px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.14);z-index:4;pointer-events:none}
.win.edit .dvd:not(.on) .dvhint{display:block}
.fold{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px}
.fold.on{background:var(--page-accent-soft);color:var(--page-accent);font-weight:700}
.fold span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold em{font-style:normal;font-size:12px;color:var(--page-ink3)}
.icard{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.icard .grow{flex:1;min-width:0}
.icard b{display:flex;align-items:center;gap:8px;font-size:13px}
.icard span.m{display:block;font-size:12px;color:var(--page-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .b{height:28px}
.libhint{display:none;padding:8px 12px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--page-line);font-size:12px;color:var(--page-ink2)}
.win.edit .libhint{display:flex;align-items:center;gap:8px}
.win.edit.islib .ebar{display:none}
.win.set .ebar{left:190px}

/* 抽屉 */
.drawer{position:absolute;right:0;top:46px;bottom:0;width:316px;background:#fff;color:var(--page-ink);box-shadow:-12px 0 32px rgba(0,0,0,.16);transform:translateX(104%);transition:transform .26s ease-out;z-index:30;display:flex;flex-direction:column}
.win.libopen .drawer{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px}
.dh h3{font-size:15px;font-weight:800;flex:1}
.dl{flex:1;overflow:auto;padding:0 16px 16px}
.dsec{font-size:12px;color:var(--page-ink3);margin:10px 0 6px}
.ditem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--page-paper2);margin-bottom:6px}
.ditem .di{width:40px;height:40px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--page-ink2)}
.ditem b{display:block;font-size:13px}
.ditem span{display:block;font-size:12px;color:var(--page-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .b{height:28px}
.dempty{font-size:12px;color:var(--page-ink3);padding:10px;border-radius:12px;border:1px dashed var(--page-line2);text-align:center}

/* 说明 */
.notes{max-width:900px;margin:16px auto 0}
.notes h2{font-size:15px;font-weight:800;color:#fff;margin-bottom:8px}
.notes ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;color:rgba(255,255,255,.76);font-size:12px}
.notes li{padding-left:14px;position:relative}
.notes li:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--page-accent)}
.notes b{color:#fff}
.notes s{color:rgba(255,255,255,.45)}
@media (max-width:700px){.notes ul{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 区块引擎 ---------- */
function pack(list,mode){
  const W=$('#inner').clientWidth,cw=(W-GAP*5)/6,out={};let x=0,y=0,rh=0;
  for(const b of list){const sp=mode==='stack'?6:Math.min(6,b.span),h=spec(b).h;
    if(x+sp>6){y+=rh+GAP;x=0;rh=0}
    out[b.id]={l:x*(cw+GAP),t:y,w:sp*cw+(sp-1)*GAP,h};x+=sp;rh=Math.max(rh,h)}
  return {out,total:y+rh,cw};
}
function makeEl(b){
  const el=document.createElement('div');el.className='blk';el.dataset.id=b.id;
  el.innerHTML='<div class="bc"></div><div class="lab"></div><div class="acts"></div><div class="rz"><b></b></div>';
  $('#inner').appendChild(el);els[b.id]=el;
  const sp=spec(b),builtin=isB(b);
  el.querySelector('.bc').innerHTML=sp.c();
  el.querySelector('.lab').innerHTML=`<span class="gr">${I.grip}</span>${builtin?sp.t:sp.name}${builtin?'':'<em>· 组件</em>'}`;
  el.querySelector('.acts').innerHTML=builtin?`<button data-k="hide" title="隐藏（可在「添加」里找回）">${I.eyeoff}</button>`:`<button class="del" data-k="del" title="删除这个组件">${I.trash}</button>`;
  el.addEventListener('pointerdown',onDown);
  el.querySelector('.rz').addEventListener('pointerdown',onRz);
  el.querySelector('.acts').addEventListener('click',e=>{const k=e.target.closest('button');if(!k)return;e.stopPropagation();k.dataset.k==='hide'?hideB(b.id):delB(b.id)});
  return el;
}
function renderBlocks(list,skip){
  if(!$('#inner'))return;
  list=list||st().blocks;const p=pack(list,st().mode);
  for(const b of list){const el=els[b.id]||makeEl(b);el.classList.toggle('sel',sel===b.id);
    if(b.id===skip)continue;const r=p.out[b.id];Object.assign(el.style,{left:r.l+'px',top:r.t+'px',width:r.w+'px',height:r.h+'px'})}
  for(const id in els)if(!list.find(b=>b.id===id)){els[id].remove();delete els[id]}
  $('#inner').style.height=p.total+'px';
  win.classList.toggle('grid',st().mode==='grid');
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.m===st().mode));
  $('#eHint').textContent=st().mode==='grid'?'拖动换位置 · 拖右边缘改宽度':'拖动调整上下顺序';
  syncBtns();renderDrawer();
}
let dA=null;
function onDown(e){
  if(!editing||e.button!==0||e.target.closest('.acts,.rz'))return;
  const el=e.currentTarget,ir=$('#inner').getBoundingClientRect();sel=el.dataset.id;renderBlocks();
  dA={id:el.dataset.id,el,sx:e.clientX,sy:e.clientY,ox:e.clientX-ir.left-el.offsetLeft,oy:e.clientY-ir.top-el.offsetTop,go:false,order:null};
  el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp,{once:true});el.addEventListener('pointercancel',onUp,{once:true});
}
function onMove(e){
  if(!dA)return;const ph=$('#ph');
  if(!dA.go){if(Math.hypot(e.clientX-dA.sx,e.clientY-dA.sy)<4)return;dA.go=true;dA.el.classList.add('drag');ph.style.display='block';win.classList.add('busy')}
  const ir=$('#inner').getBoundingClientRect(),L=e.clientX-ir.left-dA.ox,T=e.clientY-ir.top-dA.oy;
  dA.el.style.left=L+'px';dA.el.style.top=T+'px';
  const cx=L+dA.el.offsetWidth/2,cy=T+dA.el.offsetHeight/2,s=st();
  const me=s.blocks.find(b=>b.id===dA.id),oth=s.blocks.filter(b=>b.id!==dA.id);let best=null,bd=1e9;
  for(let i=0;i<=oth.length;i++){const c=[...oth.slice(0,i),me,...oth.slice(i)],r=pack(c,s.mode).out[me.id];
    const d=s.mode==='stack'?Math.abs(r.t+r.h/2-cy):Math.hypot(r.l+r.w/2-cx,r.t+r.h/2-cy);if(d<bd){bd=d;best={c,r}}}
  dA.order=best.c;renderBlocks(best.c,dA.id);
  Object.assign(ph.style,{left:best.r.l+'px',top:best.r.t+'px',width:best.r.w+'px',height:best.r.h+'px'});
  const cv=$('#cv'),cr=cv.getBoundingClientRect();if(e.clientY>cr.bottom-36)cv.scrollTop+=12;else if(e.clientY<cr.top+36)cv.scrollTop-=12;
}
function onUp(){
  const d=dA;dA=null;if(!d)return;
  d.el.removeEventListener('pointermove',onMove);d.el.classList.remove('drag');$('#ph').style.display='none';win.classList.remove('busy');
  if(d.go&&d.order&&d.order.map(b=>b.id).join()!==st().blocks.map(b=>b.id).join()){pushH();st().blocks=d.order}
  renderBlocks();
}
let rA=null;
function onRz(e){
  e.stopPropagation();if(!editing||st().mode!=='grid')return;
  const el=e.currentTarget.closest('.blk'),b=st().blocks.find(x=>x.id===el.dataset.id);
  sel=b.id;rA={b,el,sx:e.clientX,s0:b.span,snap:JSON.stringify(st())};el.classList.add('rs');win.classList.add('busy');updRz();
  const h=e.currentTarget;h.setPointerCapture(e.pointerId);
  h.onpointermove=ev=>{const cw=pack(st().blocks,'grid').cw,n=Math.round((ev.clientX-rA.sx)/(cw+GAP));
    const sp=Math.max(spec(rA.b).min||2,Math.min(6,rA.s0+n));if(sp!==rA.b.span){rA.b.span=sp;renderBlocks();updRz()}};
  h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null;el.classList.remove('rs');win.classList.remove('busy');
    if(rA.b.span!==rA.s0){H[cur].h.push(rA.snap);H[cur].f=[]}rA=null;renderBlocks()};
}
function updRz(){if(rA)rA.el.querySelector('.rz b').textContent=`${rA.b.span} / 6 列`}
function flash(id){const el=els[id];if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function hideB(id){pushH();const s=st();s.blocks=s.blocks.filter(b=>b.id!==id);s.hidden.push(id);sel=null;renderBlocks();toast(`已隐藏「${P().blocks[id].t}」· 在「添加」里可以找回`)}
function delB(id){const s=st(),b=s.blocks.find(x=>x.id===id);pushH();s.blocks=s.blocks.filter(x=>x.id!==id);sel=null;renderBlocks();toast(`已删除「${WT[b.w].name}」· Ctrl+Z 撤销`)}
function showB(id){pushH();const s=st();s.hidden=s.hidden.filter(x=>x!==id);s.blocks.push({id,span:P().blocks[id].span});renderBlocks();flash(id);toast(`已显示「${P().blocks[id].t}」`)}
function addW(w){const W=WT[w],s=st();if(!W.multi&&s.blocks.some(b=>b.w===w))return;const b={id:'w'+(nid++),w,span:W.span};pushH();s.blocks.push(b);renderBlocks();flash(b.id);toast(`已添加「${W.name}」到末尾`)}
function renderDrawer(){
  if(!P().blocks)return;const s=st();
  $('#hidList').innerHTML=s.hidden.length?s.hidden.map(id=>{const B=P().blocks[id];return `<div class="ditem"><div class="di">${I.box}</div><div><b>${B.t}</b><span>${B.desc||'这一页自带的内容'}</span></div><button class="b soft" data-show="${id}">显示</button></div>`}).join(''):'<div class="dempty">没有隐藏的内容</div>';
  $('#wList').innerHTML=Object.entries(WT).map(([w,W])=>{const used=!W.multi&&s.blocks.some(b=>b.w===w);
    return `<div class="ditem"><div class="di">${I[W.icon]}</div><div><b>${W.name}</b><span>${W.desc}</span></div><button class="b ${used?'ghost':'soft'}" data-add="${w}" ${used?'disabled':''}>${used?'已添加':'添加'}</button></div>`}).join('');
}
$('#drawer').addEventListener('click',e=>{const s=e.target.closest('[data-show]'),a=e.target.closest('[data-add]');if(s)showB(s.dataset.show);else if(a&&!a.disabled)addW(a.dataset.add)});
function undo(){const h=H[cur];if(!h||!h.h.length)return toast('没有可撤销的操作');h.f.push(JSON.stringify(st()));S[cur]=JSON.parse(h.h.pop());renderBlocks();toast('已撤销')}
function redo(){const h=H[cur];if(!h||!h.f.length)return toast('没有可重做的操作');h.h.push(JSON.stringify(st()));S[cur]=JSON.parse(h.f.pop());renderBlocks();toast('已重做')}

  else if((k==='delete'||k==='backspace')&&sel&&P().blocks){e.preventDefault();const b=st().blocks.find(x=>x.id===sel);if(b)isB(b)?hideB(sel):delB(sel)}
});
/* 支持 #p=multi&e=1 直接打开某页某状态 */
const q=new URLSearchParams(location.hash.slice(1));
go(PAGES[q.get('p')]?q.get('p'):'launch');
if(q.get('e')==='1')setEdit(true);
if(q.get('show')&&P().blocks)q.get('show').split(',').forEach(id=>{if(st().hidden.includes(id)){st().hidden=st().hidden.filter(x=>x!==id);st().blocks.push({id,span:P().blocks[id].span})}}),renderBlocks();
</script>
